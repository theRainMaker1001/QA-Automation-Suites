name: Bank Critical Heartbeat

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'api/**'
      - 'scripts/**'
      - 'package.json'
      - 'vitest.*.config.ts'
      - '.github/workflows/bank-critical-heartbeat.yml'
  schedule:
    - cron: '0 6 * * *'

jobs:
  api-heartbeat:
    name: API Heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BANK_BASE_URL: ${{ vars.BANK_BASE_URL }}
      BANK_CUSTOMER_ID: ${{ vars.BANK_CUSTOMER_ID }}
      API_LATENCY_MS: ${{ vars.API_LATENCY_MS }}
      HEARTBEAT_TIMEOUT_MS: ${{ vars.HEARTBEAT_TIMEOUT_MS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (use .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (include dev)
        run: npm ci

      - name: Run API heartbeat (critical only)
        run: |
          mkdir -p reports
          npm run test:api:critical | tee reports/api-heartbeat.log

      - name: Run Loan Decision Table tests
        run: npm run test:loans

      - name: 📊 Upload heartbeat reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-reports
          path: reports/
          if-no-files-found: warn

      - name: Commit test reports
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/
          git diff --staged --quiet || git commit -m "docs: update heartbeat reports [skip ci]"
          git push

      - name: Append PO summary to Job Summary
        if: always()
        run: |
          if [ -f "reports/heartbeat-summary.md" ]; then
            cat reports/heartbeat-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "reports/loan-api-report.md" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "---" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat reports/loan-api-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ ! -f "reports/heartbeat-summary.md" ] && [ ! -f "reports/loan-api-report.md" ]; then
            echo "Heartbeat run completed. See artifacts for details." >> "$GITHUB_STEP_SUMMARY"
          fi
