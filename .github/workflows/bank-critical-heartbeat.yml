name: Bank Critical Heartbeat

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'api/**'
      - '.github/workflows/bank-critical-heartbeat.yml'
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC

jobs:
  api-heartbeat:
    name: API Heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BANK_BASE_URL: ${{ vars.BANK_BASE_URL }}
      BANK_CUSTOMER_ID: ${{ vars.BANK_CUSTOMER_ID }}
      API_LATENCY_MS: ${{ vars.API_LATENCY_MS }}
      HEARTBEAT_TIMEOUT_MS: ${{ vars.HEARTBEAT_TIMEOUT_MS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (use .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (include dev)
        run: npm ci
        env:
          NODE_ENV: ""
          NPM_CONFIG_PRODUCTION: "false"

      - name: Run API heartbeat (vitest)
        run: |
          mkdir -p .reports
          npm run test:api | tee .reports/api-heartbeat.log

      - name: Upload dev logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-heartbeat-logs
          path: .reports/api-heartbeat.log

      - name: Upload PO summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-heartbeat-summary
          path: .reports/heartbeat-summary.md
          if-no-files-found: warn

      - name: Append PO summary to Job Summary
        if: always()
        run: |
          if [ -f ".reports/heartbeat-summary.md" ]; then
            cat .reports/heartbeat-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Heartbeat run completed. See artifacts for details." >> "$GITHUB_STEP_SUMMARY"
          fi