name: Bank Critical Heartbeat

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_call: {}

jobs:
  api-heartbeat:
    name: API Heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BANK_BASE_URL: ${{ vars.BANK_BASE_URL }}
      BANK_CUSTOMER_ID: ${{ vars.BANK_CUSTOMER_ID }}
      API_LATENCY_MS: ${{ vars.API_LATENCY_MS }}
      HEARTBEAT_TIMEOUT_MS: ${{ vars.HEARTBEAT_TIMEOUT_MS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (include dev)
        run: npm ci

      - name: Init reports dir
        run: |
          mkdir -p .reports
          printf "## Bank Heartbeat\n\n" > .reports/heartbeat-summary.md
          echo "_Run started (UTC): $(date -u)_" >> .reports/heartbeat-summary.md

      - name: Run API heartbeat (vitest)
        run: |
          npm run test:api | tee .reports/api-heartbeat.log
          echo "" >> .reports/heartbeat-summary.md
          echo "_Finished (UTC): $(date -u)_" >> .reports/heartbeat-summary.md

      - name: Upload dev logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-heartbeat-logs
          path: .reports/api-heartbeat.log

      - name: Upload PO summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-heartbeat-summary
          path: .reports/heartbeat-summary.md
          if-no-files-found: error

      - name: Append PO summary to Job Summary
        if: always()
        run: cat .reports/heartbeat-summary.md >> "$GITHUB_STEP_SUMMARY"
