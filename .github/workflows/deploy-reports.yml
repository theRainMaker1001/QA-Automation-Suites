name: Deploy Test Reports & Dashboards

on:
  workflow_run:
    workflows: ['Testing Lanes - Risk-Based Orchestration', 'E2E Testing Lanes']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    # Deploy on success, failure, or manual dispatch - failures need reporting too
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java (for Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install chromium --with-deps

      # ════════════════════════════════════════════════════════════════════════
      # RESTORE ALLURE HISTORY FROM CACHE (More reliable than artifacts)
      # ════════════════════════════════════════════════════════════════════════
      - name: Restore Allure history from cache
        uses: actions/cache/restore@v4
        id: allure-cache
        with:
          path: allure-history-cache
          key: allure-history-${{ github.ref_name }}
          restore-keys: |
            allure-history-main
            allure-history-

      # ════════════════════════════════════════════════════════════════════════
      # GENERATE TEST DATA (only on manual dispatch; workflow_run already has artifacts)
      # ════════════════════════════════════════════════════════════════════════
      - name: Generate test reports (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "success" > run_status.txt
          mkdir -p reports allure-results
          npm run test:unit:report || echo "failure" > run_status.txt
          npm run test:api || echo "failure" > run_status.txt
          npm run test:loans || echo "failure" > run_status.txt
          npx playwright test -c e2e/playwright.config.ts --grep @regression --project=chromium || echo "failure" > run_status.txt
          npx tsx scripts/run-a11y-tests.ts || echo "failure" > run_status.txt
        env:
          BANK_BASE_URL: ${{ vars.BANK_BASE_URL }}
          BANK_CUSTOMER_ID: ${{ vars.BANK_CUSTOMER_ID }}

      - name: Copy local Allure results to merged
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p allure-results-merged
          if [ -d "allure-results" ]; then
            cp -r allure-results/* allure-results-merged/ 2>/dev/null || true
          fi

      # ════════════════════════════════════════════════════════════════════════
      # DOWNLOAD ALLURE RESULTS FROM TEST WORKFLOWS
      # ════════════════════════════════════════════════════════════════════════
      - name: Determine artifact source run IDs
        id: get_run_ids
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ── Resolve latest nightly (scheduled) run independently ──────────
          # Nightly regression and a11y data must always come from the most recent
          # scheduled (or manual regression) playwright.yml run, regardless of what
          # triggered this deploy. Scanning the last 20 runs avoids picking up
          # irrelevant runs, though we now include manual dispatches.
          NIGHTLY_RUN_ID=$(gh run list --workflow "playwright.yml" --branch main \
            --limit 20 --json databaseId,event \
            --jq '[.[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].databaseId')
          echo "nightly_run_id=${NIGHTLY_RUN_ID}" >> $GITHUB_OUTPUT

          # ── Resolve CI and general E2E run IDs ────────────────────────────
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            CI_RUN_ID=$(gh run list --workflow "ci.yml" --branch main --limit 1 --json databaseId --jq '.[0].databaseId')
            E2E_RUN_ID=$(gh run list --workflow "playwright.yml" --branch main --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "Manual trigger: CI=$CI_RUN_ID, E2E=$E2E_RUN_ID, Nightly=$NIGHTLY_RUN_ID"
          elif [ "${{ github.event.workflow_run.name }}" == "Testing Lanes - Risk-Based Orchestration" ]; then
            CI_RUN_ID=${{ github.event.workflow_run.id }}
            E2E_RUN_ID=$(gh run list --workflow "playwright.yml" --branch main --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "CI trigger: CI=$CI_RUN_ID, E2E=$E2E_RUN_ID, Nightly=$NIGHTLY_RUN_ID"
          else
            E2E_RUN_ID=${{ github.event.workflow_run.id }}
            CI_RUN_ID=$(gh run list --workflow "ci.yml" --branch main --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "E2E trigger: CI=$CI_RUN_ID, E2E=$E2E_RUN_ID, Nightly=$NIGHTLY_RUN_ID"
          fi

          echo "ci_run_id=${CI_RUN_ID}" >> $GITHUB_OUTPUT
          echo "e2e_run_id=${E2E_RUN_ID}" >> $GITHUB_OUTPUT

      # CI workflow artifacts (unit, smoke, critical)
      - name: Download Allure results (unit)
        if: steps.get_run_ids.outputs.ci_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: allure-results-unit
          path: allure-results/unit/
          run-id: ${{ steps.get_run_ids.outputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download Allure results (smoke)
        if: steps.get_run_ids.outputs.ci_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: allure-results-smoke
          path: allure-results/smoke/
          run-id: ${{ steps.get_run_ids.outputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download Allure results (critical)
        if: steps.get_run_ids.outputs.ci_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: allure-results-critical
          path: allure-results/critical/
          run-id: ${{ steps.get_run_ids.outputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # E2E workflow artifacts (smoke, critical, nightly)
      - name: Download Allure results (E2E smoke)
        if: steps.get_run_ids.outputs.e2e_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: allure-results-e2e-smoke
          path: allure-results/e2e-smoke/
          run-id: ${{ steps.get_run_ids.outputs.e2e_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download Allure results (E2E critical)
        if: steps.get_run_ids.outputs.e2e_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: allure-results-e2e-critical
          path: allure-results/e2e-critical/
          run-id: ${{ steps.get_run_ids.outputs.e2e_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Nightly Allure: try the E2E trigger run first (catches manual dispatches),
      # then fall back to the last scheduled nightly if the trigger had no nightly data.
      - name: Download Allure results (E2E nightly - from trigger)
        id: nightly_allure_trigger
        if: steps.get_run_ids.outputs.e2e_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: allure-results-e2e-nightly
          path: allure-results/e2e-nightly/
          run-id: ${{ steps.get_run_ids.outputs.e2e_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download Allure results (E2E nightly - scheduled fallback)
        if: steps.nightly_allure_trigger.outcome != 'success' && steps.get_run_ids.outputs.nightly_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: allure-results-e2e-nightly
          path: allure-results/e2e-nightly/
          run-id: ${{ steps.get_run_ids.outputs.nightly_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # ════════════════════════════════════════════════════════════════════════
      # DOWNLOAD STAKEHOLDER REPORT DATA
      # ════════════════════════════════════════════════════════════════════════
      - name: Resolve stakeholder artifact run IDs (deterministic)
        id: stakeholder_run_ids
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          has_artifact() {
            local run_id="$1"
            local artifact_name="$2"
            gh api "repos/${REPO}/actions/runs/${run_id}/artifacts" \
              --jq ".artifacts[]? | select(.name == \"${artifact_name}\" and .expired == false) | .id" \
              | head -n 1
          }

          find_run_with_artifact() {
            local workflow="$1"
            local artifact_name="$2"
            local allowed_events="$3"
            local limit="${4:-40}"

            gh run list --workflow "$workflow" --branch main --status success --limit "$limit" --json databaseId,event \
              --jq '.[] | "\(.databaseId) \(.event)"' | while read -r run_id event; do
                [ -z "${run_id:-}" ] && continue
                if [ -n "$allowed_events" ] && ! grep -qw "$event" <<< "$allowed_events"; then
                  continue
                fi

                artifact_id="$(has_artifact "$run_id" "$artifact_name" || true)"
                if [ -n "${artifact_id:-}" ]; then
                  echo "$run_id"
                  break
                fi
              done
          }

          UNIT_RUN_ID="$(find_run_with_artifact "ci.yml" "unit-reports" "push pull_request workflow_dispatch" || true)"
          CRITICAL_RUN_ID="$(find_run_with_artifact "ci.yml" "reports-critical" "pull_request workflow_dispatch" || true)"
          NIGHTLY_RUN_ID="$(find_run_with_artifact "playwright.yml" "reports-nightly" "schedule workflow_dispatch" || true)"

          echo "unit_run_id=${UNIT_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "critical_run_id=${CRITICAL_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "nightly_run_id=${NIGHTLY_RUN_ID}" >> "$GITHUB_OUTPUT"

          echo "Resolved stakeholder runs:"
          echo "  unit-reports   -> ${UNIT_RUN_ID:-none}"
          echo "  reports-critical -> ${CRITICAL_RUN_ID:-none}"
          echo "  reports-nightly  -> ${NIGHTLY_RUN_ID:-none}"

      - name: Download unit reports (stakeholder data)
        if: steps.stakeholder_run_ids.outputs.unit_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: unit-reports
          path: reports/
          run-id: ${{ steps.stakeholder_run_ids.outputs.unit_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download critical reports (stakeholder data)
        if: steps.stakeholder_run_ids.outputs.critical_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: reports-critical
          path: reports/
          run-id: ${{ steps.stakeholder_run_ids.outputs.critical_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download nightly reports (stakeholder data)
        if: steps.stakeholder_run_ids.outputs.nightly_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: reports-nightly
          path: reports/
          run-id: ${{ steps.stakeholder_run_ids.outputs.nightly_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Validate stakeholder input files
        id: validate_stakeholder_inputs
        run: |
          required_files=(
            "reports/unit-summary.json"
            "reports/loan-results.json"
            "reports/e2e-critical-results.json"
            "reports/e2e-regression-results.json"
            "reports/a11y-results.json"
          )

          missing=0
          missing_files=()
          for f in "${required_files[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::warning::Missing stakeholder input: $f"
              missing=$((missing + 1))
              missing_files+=("$f")
            fi
          done

          if [ "$missing" -gt 0 ]; then
            echo "::warning::Stakeholder dashboard is partial (${missing} required files missing)."
            missing_csv=$(IFS=, ; echo "${missing_files[*]}")
            echo "missing_files=${missing_csv}" >> "$GITHUB_OUTPUT"
          else
            echo "Stakeholder dataset is complete."
            echo "missing_files=" >> "$GITHUB_OUTPUT"
          fi
          echo "missing_count=${missing}" >> "$GITHUB_OUTPUT"

      - name: Enforce complete stakeholder dataset on main
        if: github.ref_name == 'main' && steps.validate_stakeholder_inputs.outputs.missing_count != '0'
        env:
          MISSING_COUNT: ${{ steps.validate_stakeholder_inputs.outputs.missing_count }}
          MISSING_FILES: ${{ steps.validate_stakeholder_inputs.outputs.missing_files }}
        run: |
          echo "::error::Stakeholder dashboard deployment blocked on main. Missing ${MISSING_COUNT} required files: ${MISSING_FILES}"
          exit 1

      - name: List available stakeholder data
        run: |
          echo "Stakeholder report data:"
          ls -la reports/ 2>/dev/null || echo "No report data available"

      - name: Get previous history run ID
        id: get_history_run_id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow "deploy-reports.yml" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Download previous Allure history
        if: steps.get_history_run_id.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: allure-history
          path: allure-results/history/
          run-id: ${{ steps.get_history_run_id.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # ════════════════════════════════════════════════════════════════════════
      # MERGE ALLURE RESULTS
      # ════════════════════════════════════════════════════════════════════════
      - name: Merge Allure results
        run: |
          mkdir -p allure-results-merged

          # Flatten all Allure result files from nested subdirectories into a single directory.
          # Each test run produces UUID-named files so collisions are not a concern.
          find allure-results/ -type f \
            -not -path "allure-results/history/*" \
            -exec cp {} allure-results-merged/ \;

          # Priority 1: Use cached history (most reliable)
          if [ -d "allure-history-cache" ] && [ "$(ls -A allure-history-cache 2>/dev/null)" ]; then
            echo "Restoring history from cache..."
            mkdir -p allure-results-merged/history
            cp -r allure-history-cache/* allure-results-merged/history/
            echo "History injected from cache: $(ls allure-results-merged/history/)"
          # Priority 2: Fallback to artifact-based history
          elif [ -d "allure-results/history" ] && [ "$(ls -A allure-results/history 2>/dev/null)" ]; then
            echo "Restoring history from artifact..."
            mkdir -p allure-results-merged/history
            cp -r allure-results/history/* allure-results-merged/history/
          else
            echo "No previous history found - this will be the first run with trends"
          fi

          echo "Merged Allure results:"
          ls -la allure-results-merged/ || echo "No results to merge"

      # ════════════════════════════════════════════════════════════════════════
      # ALLURE METADATA (categories + environment for developer dashboard)
      # ════════════════════════════════════════════════════════════════════════
      - name: Add Allure categories and environment
        run: |
          # Categories define how failures are grouped in the Allure Categories tab
          cp allure-config/categories.json allure-results-merged/categories.json 2>/dev/null || true

          # Environment metadata shown in Allure Environment section
          cat > allure-results-merged/environment.properties << ENVEOF
          Base.URL=${BANK_BASE_URL:-https://parabank.parasoft.com/parabank}
          Node.Version=$(node --version)
          Trigger=${{ github.event_name }}
          CI.Run=${{ github.run_id }}
          Branch=${{ github.ref_name }}
          ENVEOF
        env:
          BANK_BASE_URL: ${{ vars.BANK_BASE_URL }}

      # ════════════════════════════════════════════════════════════════════════
      # CONVERT INTO NEW ALLURE REPORT
      # ════════════════════════════════════════════════════════════════════════
      - name: Generate Allure report
        run: |
          if [ -d "allure-results-merged" ] && [ "$(ls -A allure-results-merged 2>/dev/null)" ]; then
            npx allure generate allure-results-merged --clean -o public/allure
            echo "Allure report generated"
          else
            mkdir -p public/allure
            echo "<html><body><h1>No Allure results available</h1><p>Run tests first to generate results.</p></body></html>" > public/allure/index.html
            echo "No Allure results - created placeholder"
          fi

      # ════════════════════════════════════════════════════════════════════════
      # GENERATE STAKEHOLDER DASHBOARD
      # ════════════════════════════════════════════════════════════════════════
      - name: Generate Stakeholder dashboard
        run: |
          echo "Available report data for stakeholder dashboard:"
          ls -la reports/*.json 2>/dev/null || echo "  No JSON files found"
          npm run report:stakeholder
          mkdir -p public/stakeholder
          if [ -f "reports/stakeholder-dashboard.html" ]; then
            cp reports/stakeholder-dashboard.html public/stakeholder/index.html
            cp reports/stakeholder-dashboard.json public/stakeholder/ 2>/dev/null || true
          fi

      - name: Generate a11y compliance report (fallback)
        run: |
          if [ ! -f "reports/a11y-compliance-report.md" ] && [ -f "reports/a11y-results.json" ]; then
            echo "No a11y MD report in artifacts - generating from JSON..."
            npx tsx scripts/generate-a11y-compliance-report.ts
          fi

      - name: Convert a11y compliance report to HTML
        run: |
          if [ -f "reports/a11y-compliance-report.md" ]; then
            # Simple markdown to HTML conversion with styling
            cat > public/a11y-compliance-report.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>WCAG Accessibility Compliance Report</title>
            <style>
              * { box-sizing: border-box; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: #0d1117;
                color: #c9d1d9;
                padding: 2rem;
                max-width: 900px;
                margin: 0 auto;
                line-height: 1.6;
              }
              h1, h2, h3, h4 { color: #f0f6fc; margin-top: 2rem; }
              h1 { border-bottom: 1px solid #30363d; padding-bottom: 0.5rem; }
              table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
              th, td { border: 1px solid #30363d; padding: 0.75rem; text-align: left; }
              th { background: #161b22; }
              blockquote { border-left: 4px solid #58a6ff; padding-left: 1rem; margin: 1rem 0; color: #8b949e; }
              a { color: #58a6ff; }
              hr { border: none; border-top: 1px solid #30363d; margin: 2rem 0; }
              .back-link { margin-bottom: 2rem; }
            </style>
          </head>
          <body>
            <div class="back-link"><a href="./stakeholder/">← Back to Stakeholder Dashboard</a></div>
            <div id="content"></div>
            <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
            <script>
          HTMLEOF
            # Embed the markdown content as a JS string
            echo "const md = \`" >> public/a11y-compliance-report.html
            cat reports/a11y-compliance-report.md | sed 's/`/\\`/g' | sed 's/\$/\\$/g' >> public/a11y-compliance-report.html
            echo "\`;" >> public/a11y-compliance-report.html
            cat >> public/a11y-compliance-report.html << 'HTMLEOF2'
              document.getElementById('content').innerHTML = marked.parse(md);
            </script>
          </body>
          </html>
          HTMLEOF2
            echo "A11y compliance report converted to HTML"
          else
            cat > public/a11y-compliance-report.html << 'PLACEHOLDER'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>WCAG Accessibility Compliance Report</title>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: #0d1117;
                color: #c9d1d9;
                padding: 2rem;
                max-width: 900px;
                margin: 0 auto;
                text-align: center;
                min-height: 80vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
              }
              h1 { color: #f0f6fc; margin-bottom: 1rem; }
              p { color: #8b949e; margin-bottom: 2rem; max-width: 600px; }
              a { color: #58a6ff; }
            </style>
          </head>
          <body>
            <h1>WCAG Compliance Report</h1>
            <p>No accessibility test data is available yet. The report will be generated after the next nightly audit run that includes <code>@a11y</code> tests.</p>
            <p><a href="./stakeholder/">Back to Stakeholder Dashboard</a></p>
          </body>
          </html>
          PLACEHOLDER
            echo "A11y placeholder page created (no test data available yet)"
          fi

      # ════════════════════════════════════════════════════════════════════════
      # CREATE DASHBOARD HUB (NAVIGATION)
      # ════════════════════════════════════════════════════════════════════════
      - name: Create dashboard hub
        run: |
          # Determine pipeline status for the badge
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -f run_status.txt ] && grep -q "failure" run_status.txt; then
              PIPELINE_STATUS="failure"
            else
              PIPELINE_STATUS="success"
            fi
          else
            PIPELINE_STATUS="${{ github.event.workflow_run.conclusion }}"
          fi

          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>QA Automation Suite - Dashboard Hub</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
                color: #c9d1d9;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem;
              }
              .container { max-width: 800px; text-align: center; }
              h1 { color: #f0f6fc; font-size: 2.5rem; margin-bottom: 0.5rem; }
              .subtitle { color: #8b949e; margin-bottom: 1.5rem; font-size: 1.1rem; }
              #status-container {
                margin-bottom: 1.75rem;
                display: flex;
                justify-content: center;
              }
              .status-badge {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 270px;
                padding: 0.6rem 1rem;
                border-radius: 999px;
                border: 1px solid transparent;
                font-size: 0.9rem;
                font-weight: 700;
                letter-spacing: 0.02em;
              }
              .status-success {
                color: #e8fff0;
                background: rgba(34, 197, 94, 0.2);
                border-color: rgba(34, 197, 94, 0.65);
                box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.12) inset;
              }
              .status-failure {
                color: #ffecec;
                background: rgba(239, 68, 68, 0.2);
                border-color: rgba(239, 68, 68, 0.7);
                box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.12) inset;
              }
              .cards {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 1.5rem;
              }
              .card {
                background: #161b22;
                border: 1px solid #30363d;
                border-radius: 12px;
                padding: 2rem;
                text-decoration: none;
                color: inherit;
                transition: all 0.3s ease;
              }
              .card:hover {
                border-color: #58a6ff;
                transform: translateY(-4px);
                box-shadow: 0 8px 30px rgba(0,0,0,0.3);
              }
              .card h2 { color: #f0f6fc; margin-bottom: 0.75rem; font-size: 1.5rem; }
              .card p { color: #8b949e; font-size: 0.95rem; line-height: 1.5; }
              .card .icon { font-size: 2.5rem; margin-bottom: 1rem; }
              .stakeholder .icon { color: #3fb950; }
              .developer .icon { color: #58a6ff; }
              .footer {
                margin-top: 3rem;
                color: #8b949e;
                font-size: 0.85rem;
              }
              .footer a { color: #58a6ff; text-decoration: none; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>QA Automation Suite</h1>
              <p class="subtitle">FinTech Quality Engineering - Dashboard Hub</p>

              <!-- Status Injection -->
              <div id="status-container">
                {{STATUS_BADGE}}
              </div>

              <div class="cards">
                <a href="./stakeholder/" class="card stakeholder">
                  <div class="icon">📊</div>
                  <h2>Stakeholder Dashboard</h2>
                  <p>Executive summary with confidence metrics, risk indicators, and WCAG compliance status. Ideal for PMs and leadership.</p>
                </a>

                <a href="./allure/" class="card developer">
                  <div class="icon">🔬</div>
                  <h2>Developer Dashboard</h2>
                  <p>Detailed Allure report with full test results, execution history, trends, and failure analysis. Ideal for QA staff alongside developers.</p>
                </a>
              </div>

              <div class="footer">
                <p>Last deployed: <span id="date"></span></p>
                <p><a href="https://github.com/theRainMaker1001/QA-Automation-Suites" target="_blank">View Repository</a></p>
              </div>
              <script>document.getElementById('date').textContent = new Date().toLocaleString();</script>
            </div>
          </body>
          </html>
          EOF

          # Inject status into the HTML
          if [ "$PIPELINE_STATUS" == "success" ]; then
            sed -i 's|{{STATUS_BADGE}}|<span class="status-badge status-success">Pipeline Status: PASSING</span>|' public/index.html
          elif [ "$PIPELINE_STATUS" == "failure" ]; then
            sed -i 's|{{STATUS_BADGE}}|<span class="status-badge status-failure">Pipeline Status: FAILED</span>|' public/index.html
          else
            # Treat cancelled/skipped/neutral/timed_out/action_required as attention needed
            sed -i 's|{{STATUS_BADGE}}|<span class="status-badge status-failure">Pipeline Status: ATTENTION REQUIRED</span>|' public/index.html
          fi

      # ════════════════════════════════════════════════════════════════════════
      # PRESERVE ALLURE HISTORY FOR NEXT RUN (Cache + Artifact backup)
      # ════════════════════════════════════════════════════════════════════════
      - name: Prepare Allure history for cache
        if: always()
        run: |
          mkdir -p allure-history-cache
          if [ -d "public/allure/history" ]; then
            cp -r public/allure/history/* allure-history-cache/ 2>/dev/null || true
            echo "History files staged for cache: $(ls allure-history-cache/ | wc -l)"
          else
            echo "No history directory found in generated report"
          fi

      - name: Save Allure history to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: allure-history-cache
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Allure history (backup)
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: public/allure/history/
          retention-days: 90
          if-no-files-found: ignore

      # ════════════════════════════════════════════════════════════════════════
      # DEPLOY TO GITHUB PAGES
      # ════════════════════════════════════════════════════════════════════════
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
