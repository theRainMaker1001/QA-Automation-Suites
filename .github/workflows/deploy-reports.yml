name: Deploy Test Reports

on:
  workflow_run:
    workflows: ['Critical Function Healthcheck', 'Code Quality & Unit Tests']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Generate all reports
        run: |
          mkdir -p reports
          npm run test:api:critical || true
          npm run test:loans || true
          npm run test:unit:report || true
          npm run test:a11y:report || true
        env:
          BANK_BASE_URL: ${{ vars.BANK_BASE_URL }}
          BANK_CUSTOMER_ID: ${{ vars.BANK_CUSTOMER_ID }}

      - name: Convert markdown to HTML
        run: |
          npm install -g marked
          for file in reports/*.md; do
            if [ -f "$file" ]; then
              basename="${file%.md}"
              echo "<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>$(basename "$file" .md)</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;max-width:900px;margin:0 auto;padding:2rem;background:#0d1117;color:#c9d1d9;line-height:1.6}h1,h2,h3{color:#fff}a{color:#58a6ff}table{border-collapse:collapse;width:100%}th,td{border:1px solid #30363d;padding:8px;text-align:left}th{background:#161b22}pre{background:#161b22;padding:1rem;overflow-x:auto;border-radius:6px}code{background:#161b22;padding:2px 6px;border-radius:3px}.back{margin-bottom:2rem;display:inline-block}</style></head><body><a href='index.html' class='back'>← Back to Reports</a>" > "${basename}.html"
              marked "$file" >> "${basename}.html"
              echo "</body></html>" >> "${basename}.html"
            fi
          done

      - name: Create reports index
        run: |
          cat > reports/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>QA Automation Suite - Test Reports</title>
            <style>
              :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --link: #58a6ff; --green: #3fb950; }
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 2rem; }
              .container { max-width: 900px; margin: 0 auto; }
              h1 { color: #fff; margin-bottom: 0.5rem; }
              .subtitle { color: #8b949e; margin-bottom: 2rem; }
              .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
              .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 1.5rem; transition: border-color 0.2s; }
              .card:hover { border-color: var(--link); }
              .card h3 { color: #fff; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
              .card p { color: #8b949e; font-size: 0.875rem; margin-bottom: 1rem; }
              .card a { color: var(--link); text-decoration: none; font-weight: 500; }
              .card a:hover { text-decoration: underline; }
              .badge { background: var(--green); color: #000; padding: 0.125rem 0.5rem; border-radius: 1rem; font-size: 0.75rem; font-weight: 600; }
              .updated { text-align: center; color: #8b949e; margin-top: 2rem; font-size: 0.875rem; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>QA Automation Suite</h1>
              <p class="subtitle">FinTech Quality Engineering - Test Reports</p>

              <div class="grid">
                <div class="card">
                  <h3><span class="badge">API</span> Loan Decision Table</h3>
                  <p>34 test cases covering decision table rules and 3-value BVA boundaries</p>
                  <a href="loan-api-report.html">View Report →</a>
                </div>

                <div class="card">
                  <h3><span class="badge">A11Y</span> Accessibility Compliance</h3>
                  <p>WCAG 2.1 AA audit with legal compliance reference</p>
                  <a href="a11y-compliance-report.html">View Report →</a>
                </div>

                <div class="card">
                  <h3><span class="badge">UNIT</span> Unit Test Summary</h3>
                  <p>50 unit tests covering HTTP client, retry logic, reporters</p>
                  <a href="unit-summary.html">View Report →</a>
                </div>

                <div class="card">
                  <h3><span class="badge">API</span> Heartbeat Summary</h3>
                  <p>Daily API health check and latency monitoring</p>
                  <a href="heartbeat-summary.html">View Report →</a>
                </div>
              </div>

              <p class="updated">Last updated: <span id="date"></span></p>
              <script>document.getElementById('date').textContent = new Date().toLocaleString();</script>
            </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
