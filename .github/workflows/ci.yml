name: CI (TypeCheck + Lint + Prettier + API Smoke)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js (read from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Type check
        run: npm run typecheck

      - name: 🧹 Lint
        run: npm run lint

      - name: 💅 Prettier format check
        run: npx prettier --check .

      - name: 🧪 API Smoke Tests
        run: |
          mkdir -p .reports
          npm run test:api:smoke

      - name: 📊 Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-smoke-reports
          path: .reports/
          if-no-files-found: warn

      - name: 📋 Append summary to Job Summary
        if: always()
        run: |
          if [ -f ".reports/integration-summary.md" ]; then
            cat .reports/integration-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📝 Commit updated reports
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .reports/*.md
          git diff --staged --quiet || git commit -m "chore(reports): update test reports [skip ci]"
          git push
