name: CI (TypeCheck + Lint + API Tests)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  heartbeat:
    name: Bank Heartbeat (first)
    uses: ./.github/workflows/bank-critical-heartbeat.yml
    secrets: inherit

  static-checks:
    name: TypeCheck + Lint + Prettier
    needs: [heartbeat]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  api-tests:
    name: API Unit/Integration
    needs: [heartbeat]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:api
