name: CI (TypeCheck + Lint + Prettier + Unit + API Smoke)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js (read from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Type check
        run: npm run typecheck

      - name: 🧹 Lint
        run: npm run lint

      - name: 💅 Prettier format check
        run: npx prettier --check .

      - name: 🧪 Unit Tests
        run: |
          mkdir -p reports
          npm run test:unit

      - name: 🧪 API Smoke Tests
        run: npm run test:api

      - name: 📊 Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: error

      - name: 📋 Append summary to Job Summary
        if: always()
        run: |
          if [ -f "reports/integration-summary.md" ]; then
            cat reports/integration-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
