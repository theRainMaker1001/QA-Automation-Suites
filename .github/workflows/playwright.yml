name: E2E Testing Lanes

on:
  schedule:
    # Nightly deep audit at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_lane:
        description: 'Test lane to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - critical
          - regression
          - a11y
          - audit

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # SMOKE LANE: UI Smoke
  # ════════════════════════════════════════════════════════════════════════════
  smoke:
    name: Smoke Lane
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run @smoke tests
        run: npx playwright test -c e2e/playwright.config.ts --grep @smoke --project=chromium

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload Allure results (smoke E2E)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e-smoke
          path: allure-results/e2e/
          if-no-files-found: ignore
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # CRITICAL LANE: UI Critical Only
  # ════════════════════════════════════════════════════════════════════════════
  critical:
    name: Critical Lane
    needs: smoke
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.test_lane == 'critical' || github.event.inputs.test_lane == 'regression' || github.event.inputs.test_lane == 'audit')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run @critical tests
        run: npx playwright test -c e2e/playwright.config.ts --grep @critical --project=chromium

      - name: Upload critical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: critical-artifacts
          path: e2e/test-results/
          retention-days: 7

      - name: Upload Allure results (critical E2E)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e-critical
          path: allure-results/e2e/
          if-no-files-found: ignore
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # NIGHTLY DEEP AUDIT: @regression (none critical UI) + @a11y [Overall too slow for PRs]
  # ════════════════════════════════════════════════════════════════════════════
  nightly-audit:
    name: Nightly Deep Audit
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.test_lane == 'audit' || github.event.inputs.test_lane == 'regression' || github.event.inputs.test_lane == 'a11y'))
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (all browsers)
        run: npx playwright install --with-deps

      - name: Run @regression tests
        run: npx playwright test -c e2e/playwright.config.ts --grep @regression --project=chromium --project=firefox --project=webkit

      - name: Preserve regression results before a11y overwrites
        if: always()
        run: |
          cp reports/e2e-results.json reports/e2e-regression-results.json 2>/dev/null || true

      - name: Run @a11y tests
        run: npx playwright test -c e2e/playwright.config.ts --grep @a11y --project=chromium

      - name: Generate a11y compliance report
        if: always()
        run: npx tsx scripts/generate-a11y-compliance-report.ts

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-audit-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-artifacts
          path: e2e/test-results/
          retention-days: 14

      - name: Upload stakeholder report data (nightly)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-nightly
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Allure results (nightly E2E)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e-nightly
          path: allure-results/e2e/
          if-no-files-found: ignore
          retention-days: 30
