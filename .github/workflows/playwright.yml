name: E2E Testing Lanes

on:
  schedule:
    # Nightly deep audit at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_lane:
        description: 'Test lane to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - critical
          - regression
          - a11y
          - audit

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # SMOKE LANE: UI Smoke
  # ════════════════════════════════════════════════════════════════════════════
  smoke:
    name: Smoke Lane
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run @smoke tests
        run: npx playwright test -c e2e/playwright.config.ts --grep @smoke --project=chromium

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload Allure results (smoke E2E)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e-smoke
          path: allure-results/e2e/
          if-no-files-found: ignore
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # CRITICAL LANE: UI Critical Only
  # ════════════════════════════════════════════════════════════════════════════
  critical:
    name: Critical Lane
    needs: smoke
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.test_lane == 'critical' || github.event.inputs.test_lane == 'regression' || github.event.inputs.test_lane == 'audit')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run @critical tests
        run: |
          npx playwright test -c e2e/playwright.config.ts --grep @critical --project=chromium || true
          npm run verify:e2e:critical

      - name: Upload critical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: critical-artifacts
          path: e2e/test-results/
          retention-days: 7

      - name: Upload Allure results (critical E2E)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e-critical
          path: allure-results/e2e/
          if-no-files-found: ignore
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # NIGHTLY DEEP AUDIT: @regression (cross-browser matrix) + @a11y
  # Runs inside the official Playwright Docker image for exact environment
  # parity with local docker compose runs. Docker layer caching keeps
  # subsequent CI runs fast after the first image build.
  # ════════════════════════════════════════════════════════════════════════════
  nightly-audit:
    name: Nightly Deep Audit (Docker)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.test_lane == 'audit' || github.event.inputs.test_lane == 'regression' || github.event.inputs.test_lane == 'a11y'))
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          # Cache key covers the Dockerfile and all npm dependencies.
          # Invalidates only when browsers/Node layer or dependency tree changes.
          key: docker-nightly-${{ hashFiles('Dockerfile', 'package-lock.json') }}
          restore-keys: |
            docker-nightly-

      - name: Build nightly regression image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: qa-nightly:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          load: true

      # Rotate the cache so stale layers from the previous run are not kept.
      - name: Rotate Docker layer cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # Create host-side bind-mount targets before docker run so Docker does
      # not create them as root-owned directories.
      - name: Create output directories
        run: mkdir -p reports allure-results/e2e e2e/test-results e2e/playwright-report

      - name: Run nightly audit via Docker
        env:
          BANK_BASE_URL: ${{ vars.BANK_BASE_URL }}
        run: |
          docker run --rm \
            -v "$PWD/reports:/app/reports" \
            -v "$PWD/allure-results/e2e:/app/allure-results/e2e" \
            -v "$PWD/e2e/test-results:/app/e2e/test-results" \
            -v "$PWD/e2e/playwright-report:/app/e2e/playwright-report" \
            -e CI=true \
            -e "BANK_BASE_URL=${BANK_BASE_URL:-https://parabank.parasoft.com/parabank}" \
            qa-nightly:latest

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-audit-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-artifacts
          path: e2e/test-results/
          retention-days: 14

      - name: Upload stakeholder report data (nightly)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-nightly
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Allure results (nightly E2E)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e-nightly
          path: allure-results/e2e/
          if-no-files-found: ignore
          retention-days: 30
